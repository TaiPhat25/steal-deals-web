name: stealdeal-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-stealdeal-frontend:local}
    container_name: stealdeal-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stealdeal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_WWW_DIR:-./.local/certbot/www}:/var/www/certbot:ro
      - ${CERTBOT_CONF_DIR:-./.local/certbot/conf}:/etc/letsencrypt:ro
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  default:
    name: stealdeal-network
    external: true
