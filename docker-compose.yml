name: stealdeal-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stealdeal-frontend
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stealdeal-nginx
    ports:
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  default:
    name: stealdeal-network
    external: true
