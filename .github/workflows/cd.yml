name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA whose image or frontend configuration should be deployed
        required: true
        type: string
      frontend_image_changed:
        description: Pull and deploy the frontend image for this SHA
        required: true
        default: true
        type: boolean
      compose_changed:
        description: Fetch and apply frontend Compose configuration from this commit
        required: true
        default: false
        type: boolean
      nginx_changed:
        description: Fetch and apply Nginx configuration from this commit
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-ec2-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  FRONTEND_REPO_PATH: /opt/stealdeal/steal-deals-web
  DEPLOY_PATH: /opt/stealdeal/steal-deals-web

jobs:
  deploy:
    name: Deploy frontend image or configuration
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment manifest
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: frontend-deployment-${{ github.event.workflow_run.head_sha }}
          path: .deploy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create manual deployment manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          FRONTEND_IMAGE_CHANGED: ${{ inputs.frontend_image_changed }}
          COMPOSE_CHANGED: ${{ inputs.compose_changed }}
          NGINX_CHANGED: ${{ inputs.nginx_changed }}
        run: |
          set -euo pipefail

          mkdir -p .deploy
          jq -n \
            --arg sha "${{ inputs.image_sha }}" \
            --argjson frontend_image_changed "$FRONTEND_IMAGE_CHANGED" \
            --argjson compose_changed "$COMPOSE_CHANGED" \
            --argjson nginx_changed "$NGINX_CHANGED" \
            '{
              commit_sha: $sha,
              frontend_image_changed: $frontend_image_changed,
              application_code_changed: $frontend_image_changed,
              compose_changed: $compose_changed,
              nginx_changed: $nginx_changed
            }' > .deploy/deployment-manifest.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Deploy through SSM
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          [[ "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]

          frontend_image="$ECR_REGISTRY/stealdeal-frontend:$IMAGE_TAG"
          frontend_image_changed=$(jq -r '.frontend_image_changed // false' .deploy/deployment-manifest.json)
          compose_changed=$(jq -r '.compose_changed // false' .deploy/deployment-manifest.json)
          nginx_changed=$(jq -r '.nginx_changed // false' .deploy/deployment-manifest.json)

          commands=$(jq -cn \
            --arg repo_path "$FRONTEND_REPO_PATH" \
            --arg path "$DEPLOY_PATH" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg deploy_sha "$IMAGE_TAG" \
            --arg image "$frontend_image" \
            --argjson frontend_image_changed "$frontend_image_changed" \
            --argjson compose_changed "$compose_changed" \
            --argjson nginx_changed "$nginx_changed" \
            '{
              commands: (
                [
                  "set -e",
                  ("export DEPLOY_SHA=" + $deploy_sha),
                  ("cd " + $path)
                ]
                + (if ($compose_changed or $nginx_changed) then [
                    ("cd " + $repo_path),
                    ("worktree_status=$(git -c safe.directory=" + $repo_path + " status --porcelain)"),
                    "test -z \"$worktree_status\"",
                    ("git -c safe.directory=" + $repo_path + " fetch origin main --prune"),
                    "git -c safe.directory=" + $repo_path + " cat-file -e \"$DEPLOY_SHA^{commit}\"",
                    "git -c safe.directory=" + $repo_path + " checkout --detach \"$DEPLOY_SHA\"",
                    ("test \"$(git -c safe.directory=" + $repo_path + " rev-parse HEAD)\" = \"$DEPLOY_SHA\""),
                    ("echo Config commit: $(git -c safe.directory=" + $repo_path + " rev-parse HEAD)"),
                    ("echo Compose SHA-256: $(sha256sum " + $path + "/docker-compose.yml | cut -d\" \" -f1)"),
                    ("echo Nginx SHA-256: $(sha256sum " + $path + "/nginx.conf | cut -d\" \" -f1)"),
                    ("cd " + $path)
                  ] else [] end)
                + (if $frontend_image_changed then [
                    "touch .env",
                    "sed -i /^FRONTEND_IMAGE=/d .env",
                    ("echo FRONTEND_IMAGE=" + $image + " >> .env"),
                    ("export FRONTEND_IMAGE=" + $image),
                    ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                    ("docker compose config --images | grep -Fqx " + $image),
                    "docker compose pull frontend"
                  ] else [] end)
                + (if $compose_changed then [
                    "docker compose config --quiet"
                  ] else [] end)
                + (if ($compose_changed or $nginx_changed) then [
                    "docker compose run --rm --no-deps nginx nginx -t"
                  ] else [] end)
                + (if ($compose_changed or $frontend_image_changed) then [
                    "docker compose up -d --no-build --force-recreate frontend nginx"
                  ] elif $nginx_changed then [
                    "docker compose up -d --no-build --force-recreate nginx"
                  ] else [
                    "echo No frontend deployment required"
                  ] end)
                + (if ($compose_changed or $nginx_changed) then [
                    "docker compose exec -T nginx nginx -t",
                    "docker compose exec -T nginx nginx -s reload"
                  ] else [] end)
                + (if ($compose_changed or $nginx_changed or $frontend_image_changed) then [
                    "docker compose ps --status running",
                    "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://localhost:80/"
                  ] else [] end)
              )
            }')

          command_id=$(aws ssm send-command \
            --instance-ids "$AWS_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy frontend $IMAGE_TAG" \
            --parameters "$commands" \
            --query Command.CommandId \
            --output text)

          wait_status=0
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$AWS_EC2_INSTANCE_ID" || wait_status=$?

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_EC2_INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_EC2_INSTANCE_ID" \
            --query Status \
            --output text)

          echo "SSM waiter exit code: $wait_status"
          echo "SSM command status: $status"
          test "$status" = Success
