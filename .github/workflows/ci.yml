name: Frontend CI

on:
  # Temporary validation branch. Expand this later to main/develop/PRs.
  push:
    branches:
      - duy-dev

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, test, and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build Next.js application
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --provenance=false --sbom=false -t stealdeal-frontend:ci-${{ github.sha }} .
