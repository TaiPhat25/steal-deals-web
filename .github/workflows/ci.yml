name: Frontend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_build:
        description: Build and publish the frontend image even when no source path changed
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.matrix.outputs.has_source }}
      frontend_image_changed: ${{ steps.matrix.outputs.frontend_image_changed }}
      compose_changed: ${{ steps.matrix.outputs.compose_changed }}
      nginx_changed: ${{ steps.matrix.outputs.nginx_changed }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_source:
              - '**'
              - '!docker-compose.yml'
              - '!nginx.conf'
              - '!.github/**'
            compose:
              - 'docker-compose.yml'
            nginx:
              - 'nginx.conf'

      - name: Build change manifest
        id: matrix
        env:
          FRONTEND_SOURCE_CHANGED: ${{ steps.filter.outputs.frontend_source }}
          COMPOSE_CHANGED: ${{ steps.filter.outputs.compose }}
          NGINX_CHANGED: ${{ steps.filter.outputs.nginx }}
          FULL_BUILD: ${{ inputs.full_build == true }}
        run: |
          set -euo pipefail

          frontend_image_changed="$FRONTEND_SOURCE_CHANGED"
          if [[ "$FULL_BUILD" == "true" ]]; then
            frontend_image_changed=true
          fi

          has_source="$frontend_image_changed"

          jq -n \
            --arg sha "$GITHUB_SHA" \
            --argjson frontend_image_changed "$frontend_image_changed" \
            --argjson compose_changed "$COMPOSE_CHANGED" \
            --argjson nginx_changed "$NGINX_CHANGED" \
            '{
              commit_sha: $sha,
              frontend_image_changed: $frontend_image_changed,
              application_code_changed: $frontend_image_changed,
              compose_changed: $compose_changed,
              nginx_changed: $nginx_changed
            }' > deployment-manifest.json

          echo "has_source=$has_source" >> "$GITHUB_OUTPUT"
          echo "frontend_image_changed=$frontend_image_changed" >> "$GITHUB_OUTPUT"
          echo "compose_changed=$COMPOSE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "nginx_changed=$NGINX_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Validate Compose configuration
        env:
          CI_ENV_FILE: ${{ runner.temp }}/frontend-compose.env
        run: |
          set -euo pipefail
          : > "$CI_ENV_FILE"
          docker compose \
            --env-file "$CI_ENV_FILE" \
            -f docker-compose.yml \
            config --quiet

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deployment-${{ github.sha }}
          path: deployment-manifest.json
          retention-days: 7

  frontend:
    name: Lint, test, and build frontend
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  docker:
    name: Build Docker image
    needs:
      - detect
      - frontend
    if: >-
      always() &&
      needs.detect.outputs.frontend_image_changed == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check immutable image tag
        id: image_check
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if aws ecr describe-images \
            --repository-name stealdeal-frontend \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: stealdeal-frontend:$IMAGE_TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet: stealdeal-frontend:$IMAGE_TAG"
          fi

      - name: Build Docker image
        if: steps.image_check.outputs.exists != 'true'
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/stealdeal-frontend:${{ github.sha }}
        run: docker build --provenance=false --sbom=false -t "$IMAGE_URI" .

      - name: Push Docker image
        if: steps.image_check.outputs.exists != 'true'
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/stealdeal-frontend:${{ github.sha }}
        run: docker push "$IMAGE_URI"
