server {
    listen 80;
    server_name localhost;

    # Cho phép upload ảnh / file lên tới 25MB
    client_max_body_size 25M;

    # Gzip nén dữ liệu cho Next.js
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cấu hình proxy headers kế thừa cho tất cả location
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =========================================================================
    # 1. FRONTEND (Next.js)
    # Tất cả request web (giao diện, static assets) vào container frontend
    # =========================================================================
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================================================
    # 2. BACKEND MICROSERVICES (Clean Service-Prefix Routing)
    # Mỗi microservice sở hữu toàn bộ namespace prefix riêng:
    # /api/identity/...     -> Identity Service (5158)
    # /api/store/...        -> Store Service    (5169)
    # /api/cart...          -> Cart Service     (5185)
    # /api/order/...        -> Order Service    (5165)
    # /api/payment/...      -> Payment Service  (5155)
    # /api/notification/... -> Notification Service (5053)
    # =========================================================================

    location /api/identity {
        proxy_pass http://identity-api:5158;
    }

    location /api/store {
        proxy_pass http://store-api:5169;
    }

    location /api/cart {
        proxy_pass http://cart-api:5185;
    }

    location /api/order {
        proxy_pass http://order-api:5165;
    }

    location /api/payment {
        proxy_pass http://payment-api:5155;
    }

    location /api/notification {
        proxy_pass http://notification-api:5053;
    }
}
