server {
    listen 80;
    server_name localhost;

    # Cho phép upload ảnh / file lên tới 25MB
    client_max_body_size 25M;

    # Gzip nén dữ liệu cho Next.js
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cấu hình proxy headers kế thừa cho tất cả location
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ========================================================
    # 1. FRONTEND (Next.js)
    # Tất cả request web (giao diện, static assets) vào container frontend
    # ========================================================
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ========================================================
    # 2. BACKEND MICROSERVICES ROUTING (qua stealdeal-network)
    # ========================================================

    # Identity API (port 5158)
    location /api/account { proxy_pass http://identity-api:5158; }
    location /api/admin-auth { proxy_pass http://identity-api:5158; }
    location /api/admin { proxy_pass http://identity-api:5158; }
    location /api/auth { proxy_pass http://identity-api:5158; }
    location /api/role { proxy_pass http://identity-api:5158; }
    location /api/user { proxy_pass http://identity-api:5158; }

    # Store API (port 5169)
    location /api/categories { proxy_pass http://store-api:5169; }
    location /api/category-suggestions { proxy_pass http://store-api:5169; }
    location /api/stores { proxy_pass http://store-api:5169; }
    location /api/reviews { proxy_pass http://store-api:5169; }
    location /api/bags { proxy_pass http://store-api:5169; }

    # Cart API (port 5185)
    location /api/cart { proxy_pass http://cart-api:5185; }

    # Order API (port 5165)
    location /api/orders { proxy_pass http://order-api:5165; }
    location /api/pickup-disputes { proxy_pass http://order-api:5165; }

    # Payment API (port 5155)
    location /api/refunds { proxy_pass http://payment-api:5155; }
    location /api/transactions { proxy_pass http://payment-api:5155; }
    location /api/vnpay { proxy_pass http://payment-api:5155; }

    # Notification API (port 5053)
    location /api/notifications { proxy_pass http://notification-api:5053; }
}
