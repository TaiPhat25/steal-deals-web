# HTTP server: keep port 80 for ACME renewal and redirect normal traffic.
server {
    listen 80;
    server_name stealdeal.store;

    # Allow image/file uploads up to 25 MB.
    client_max_body_size 25M;

    # Let’s Encrypt HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS public entrypoint.
server {
    listen 443 ssl;
    server_name stealdeal.store;

    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/stealdeal.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stealdeal.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip response compression for Next.js and API responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Shared proxy headers.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend (Next.js).
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # Backend microservices.
    location /api/identity {
        proxy_pass http://identity-api:5158;
    }

    location /api/store {
        proxy_pass http://store-api:5169;
    }

    location /api/cart {
        proxy_pass http://cart-api:5185;
    }

    location /api/order {
        proxy_pass http://order-api:5165;
    }

    location /api/payment {
        proxy_pass http://payment-api:5155;
    }

    location /api/notification {
        proxy_pass http://notification-api:5053;
    }
}
